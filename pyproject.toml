[project]
name = "databend-openmetadata-ingestion"
version = "0.1.0"
description = "Sync Databend metadata and lineage (system_history.lineage_history) into OpenMetadata via REST"
requires-python = ">=3.10"
dependencies = [
    "databend-driver>=0.25",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bend-om = "databend_openmetadata_ingestion.cli:main"
databend-openmetadata-ingestion = "databend_openmetadata_ingestion.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["databend_openmetadata_ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
