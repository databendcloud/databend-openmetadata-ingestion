[project]
name = "databend-openmetadata-ingestion"
version = "0.1.0"
description = "Sync Databend metadata and lineage (system_history.lineage_history) into OpenMetadata via REST"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Databend Cloud"}]
keywords = ["databend", "openmetadata", "lineage", "metadata"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
requires-python = ">=3.10"
dependencies = [
    "databend-driver>=0.25",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bend-om = "databend_openmetadata_ingestion.cli:main"
databend-openmetadata-ingestion = "databend_openmetadata_ingestion.cli:main"

[project.urls]
Homepage = "https://github.com/databendcloud/databend-openmetadata-ingestion"
Issues = "https://github.com/databendcloud/databend-openmetadata-ingestion/issues"
"Databend lineage docs" = "https://docs.databend.com/guides/data-management/data-lineage"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["databend_openmetadata_ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
